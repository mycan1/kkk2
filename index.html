<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON · 오리지널 풀버전</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            padding: 4px;
            min-height: 100vh;
        }
        .outer-border {
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 6px;
            max-width: 480px;
            margin: 0 auto;
            background: #0a0a0a;
        }
        .header-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 48px;
        }
        .prev-info {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #aaa;
            flex-shrink: 0;
        }
        .prev-num {
            display: inline-block;
            color: white;
            font-size: 12px;
            margin: 0 2px;
        }
        .title-main {
            font-weight: 800;
            background: linear-gradient(135deg, #fff8e0, #ffe68f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 17px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .round-text {
            color: #ffd700;
            font-weight: 900;
            font-size: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .user-info {
            background: #222;
            color: #00e6b8;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .change-name-btn {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 3px 8px;
            font-size: 10px;
            cursor: pointer;
            height: 26px;
            flex-shrink: 0;
        }
        .target-win-container {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #2ecc71;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            overflow-x: auto;
            flex: 1 1 auto;
            min-width: 0;
            justify-content: flex-end;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .target-win-container::-webkit-scrollbar {
            display: none;
        }
        .target-win-label {
            color: #ffd700;
            font-size: 14px;
            font-weight: normal;
            white-space: nowrap;
        }
        .target-win-numbers {
            color: #2ecc71;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        .mode-toggle {
            background: #333;
            border-radius: 30px;
            display: flex;
            padding: 2px;
            margin: 8px 0;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #ffd700;
            color: #000;
        }

        .compress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 8px 12px;
            margin: 8px 0;
            border: 1px solid #333;
        }
        .compress-label {
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }
        .compress-value {
            color: #00e6b8;
            font-size: 24px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
        .slider-wrapper {
            flex: 1;
            margin: 0 10px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .compress-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 10px;
            outline: none;
        }
        .compress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #00e6b8;
        }
        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-size: 13px;
            color: #ffd700;
            padding: 0 2px;
        }
        .apply-btn {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            height: 30px;
            font-size: 12px;
        }

        .status-info {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #333;
            font-size: 12px;
            line-height: 1.4;
            max-height: 380px;
            overflow-y: auto;
        }
        .stat-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin: 4px 0;
            flex-wrap: nowrap;
            min-height: 28px;
        }
        .stat-label {
            color: #00e6b8;
            font-weight: 600;
            font-size: 12px;
            min-width: 50px;
            flex-shrink: 0;
        }
        .number-group {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 1px 2px;
            font-size: 11px;
            max-width: 100%;
            white-space: normal;
        }
        .number-group span {
            display: inline-block;
            margin-right: 0;
            white-space: nowrap;
        }
        .winning-num { color: #2ecc71 !important; font-weight: bold; }
        .bonus-text { color: #aaa; }
        .rank-sup {
            font-size: 0.6em;
            vertical-align: super;
            color: #ffd700;
            margin-left: 0;
        }
        .basket-large {
            font-weight: bold;
            margin-top: 6px;
            padding: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            white-space: normal;
            color: #fff;
            font-size: 14px;
        }

        .control-panel {
            background: rgba(255,255,255,0.02);
            border-radius: 30px;
            padding: 8px 10px;
            margin: 8px 0;
            border: 1px solid #333;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #222;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .setting-item span {
            color: #ffd700;
            font-size: 13px;
            font-weight: 600;
        }
        .setting-item input {
            width: 50px;
            height: 34px;
            background: #333;
            border: 1px solid #00e6b8;
            color: white;
            border-radius: 40px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }
        .step-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }
        .round-selector {
            margin: 8px 0;
            text-align: center;
        }
        .base-round-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .round-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #222;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .round-control input {
            width: 70px;
            height: 38px;
            background: #333;
            border: 1px solid #ffd700;
            color: white;
            border-radius: 40px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }
        .round-control .step-btn {
            width: 36px;
            height: 36px;
            font-size: 22px;
        }
        .base-round-input button {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 40px;
            padding: 0 16px;
            height: 38px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin: 8px 0 4px;
        }
        button {
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            height: 40px;
            font-size: 13px;
            padding: 0 5px;
        }
        .btn-5set { background: linear-gradient(145deg, #00e6b8, #00a884); color: #000; }
        .btn-main { background: linear-gradient(145deg, #ffd700, #b8860b); color: #000; }
        .btn-sub { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
        .btn-reset { grid-column: span 3; background: #333; color: #aaa; height: 36px; }
        .btn-review { grid-column: span 3; background: linear-gradient(145deg, #ff69b4, #c71585); color: white; height: 40px; }

        /* 고정수 선택 영역 */
        .fixed-section {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ffd700;
        }
        .fixed-title {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fixed-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .fixed-number-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #333;
            border-radius: 30px;
            padding: 4px 8px;
            min-width: 50px;
        }
        .fixed-number-item label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #00e6b8;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .fixed-number-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffd700;
        }
        .fixed-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .fixed-buttons button {
            flex: 1;
            height: 36px;
            background: #00e6b8;
            color: #000;
            font-size: 12px;
        }
        .fixed-buttons button.reset {
            background: #444;
            color: #fff;
        }

        .small-note {
            color: #aaa;
            font-size: 11px;
            text-align: center;
            margin-top: 5px;
        }

        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 10px;
        }
        .popup-content {
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .popup-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            background: transparent;
            border: none;
            color: #ffd700;
            cursor: pointer;
        }
        .popup-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #ffd700;
        }

        .review-winning-numbers {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .winning-ball {
            width: 32px; height: 32px; line-height: 32px;
            text-align: center; font-size: 14px; font-weight: 900;
            border-radius: 50%;
            background: #000;
            border: 2px solid #ffd700;
            color: #fff;
        }
        .winning-ball.bonus { border-color: #ff9933; color: #ff9933; }

        .winning-input {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .winning-input input {
            width: 40px; height: 40px;
            text-align: center;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 30px;
            font-size: 14px;
        }

        .combo-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            border-bottom: 1px solid #333;
        }
        .review-combo-grid {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .review-num-box {
            width: 28px; height: 28px; line-height: 28px;
            text-align: center; font-size: 11px; font-weight: 900;
            border-radius: 50%;
            background: #000;
            border: 1px solid #444;
            color: #fff;
        }
        .review-num-box.matched { border-color: #00ff00; color: #00ff00; }
        .review-num-box.bonus-matched { border-color: #ff9933; color: #ff9933; }

        .match-badge {
            background: #00e6b8;
            color: #000;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }

        .game-canvas { width: 100%; height: 200px; background: #111; border-radius: 16px; touch-action: none; }
        .selected-numbers { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
        .selected-ball { width: 38px; height: 38px; border-radius: 50%; background: #000; border: 2px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }

        .saved-combo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 6px;
            border: 1px solid #444;
            cursor: pointer;
        }
        .saved-combo-item .selected-ball {
            width: 30px;
            height: 30px;
            font-size: 12px;
            margin: 2px;
        }
    </style>
</head>
<body>
<div class="outer-border">
    <!-- 헤더 -->
    <div class="header-line">
        <div class="prev-info">
            <span id="prevWinLabel">📌 1212회</span>
            <span id="baseRoundInfo"></span>
        </div>
        <span class="title-main">SHIN-UI-SON</span>
        <span class="round-text" id="roundDisplay">-(1213회)예상설정</span>
        <span id="userDisplay" class="user-info"></span>
    </div>

    <!-- 상태창 -->
    <div id="status" class="status-info">로딩 중...</div>

    <!-- 모드 토글 -->
    <div class="mode-toggle">
        <button class="mode-btn active" onclick="setMode('ai')" id="modeAiBtn">🤖 AI 모드</button>
        <button class="mode-btn" onclick="setMode('exclude')" id="modeExcludeBtn">🎯 제외수 모드</button>
    </div>

    <!-- 압축 슬라이더 (1~14) -->
    <div class="compress-row">
        <span class="compress-label">🔢 추천 개수</span>
        <span class="compress-value" id="compressValue">14</span>
        <div class="slider-wrapper">
            <input type="range" id="compressSlider" class="compress-slider" min="1" max="14" value="14" step="1" oninput="updateCompressValue(this.value)">
            <div class="range-labels">
                <span>1</span>
                <span>14</span>
            </div>
        </div>
        <button class="apply-btn" onclick="applyCompress()">적용</button>
    </div>

    <!-- 간격/회차 설정 -->
    <div class="control-panel">
        <div class="setting-row">
            <div class="setting-item">
                <span>간격</span>
                <button class="step-btn" onclick="changeInterval(-1)">−</button>
                <input type="number" id="intervalWeeks" min="1" max="30" value="1" step="1" readonly>
                <button class="step-btn" onclick="changeInterval(1)">+</button>
                <span>주</span>
            </div>
            <div class="setting-item">
                <span>회차</span>
                <button class="step-btn" onclick="changeCount(-1)">−</button>
                <input type="number" id="refCount" min="1" max="30" value="10" step="1" readonly>
                <button class="step-btn" onclick="changeCount(1)">+</button>
                <span>개</span>
            </div>
        </div>
    </div>

    <!-- 회차 설정 -->
    <div class="round-selector">
        <div class="base-round-input">
            <div class="round-control">
                <button class="step-btn" onclick="stepBaseRound(-1)">−</button>
                <input type="number" id="baseRoundInput" min="901" max="1300" value="1213" step="1" readonly>
                <button class="step-btn" onclick="stepBaseRound(1)">+</button>
            </div>
            <button onclick="setBaseRound()">이동</button>
        </div>
    </div>

    <!-- 메인 버튼 그룹 -->
    <div class="btn-group">
        <button class="btn-5set" onclick="process(5)">5조합</button>
        <button class="btn-main" onclick="process(10)">10조합</button>
        <button class="btn-sub" onclick="openPopup()">보관함</button>
        <button class="btn-sub" onclick="clearStorage()">초기화</button>
        <button class="btn-sub btn-reset" onclick="location.reload()">새로고침</button>
        <button class="btn-review" onclick="openReviewPopup()">📊 당첨확인</button>
        <button class="btn-sub" onclick="openGamePopup()">🎮 게임</button>
        <button class="btn-sub" onclick="showComboList()">📋 생성 조합</button>
        <button class="btn-sub" onclick="openComparisonPopup()">📊 회차별 비교</button>
    </div>

    <!-- 고정수 선택 영역 -->
    <div class="fixed-section" id="fixedSection">
        <div class="fixed-title">
            <span>📌 고정수 선택 (최대 5개)</span>
            <button class="apply-btn" onclick="clearFixed()" style="height:28px; font-size:11px;">초기화</button>
        </div>
        <div class="fixed-numbers" id="fixedNumbersContainer"></div>
        <div class="fixed-buttons">
            <button onclick="processWithFixed(5)">고정 포함 5조합</button>
            <button onclick="processWithFixed(10)">고정 포함 10조합</button>
        </div>
    </div>

    <div class="small-note">🎯 <span id="targetRound">1213</span> 예상</div>
</div>

<!-- 토스트 메시지 -->
<div class="toast" id="toast" style="position:fixed; bottom:20px; left:0; width:100%; text-align:center; z-index:9999; display:none; pointer-events:none;">
    <span style="background:#333; color:#ffd700; padding:6px 16px; border-radius:40px; font-size:13px;">✅ 저장됨</span>
</div>

<!-- 보관함 팝업 -->
<div id="popup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closePopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closePopup()">&times;</button>
        <div class="popup-title">📦 보관함</div>
        <div id="storage"></div>
    </div>
</div>

<!-- 게임 팝업 -->
<div id="gamePopup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closeGamePopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closeGamePopup()">&times;</button>
        <div class="popup-title">🎮 게임센터</div>
        <div class="game-tabs" style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="game-tab active" data-game="touch" onclick="switchGame('touch')">터치 러쉬</button>
            <button class="game-tab" data-game="reaction" onclick="switchGame('reaction')">반응속도</button>
        </div>
        <div id="touchGame" class="game-panel active">
            <canvas id="gameCanvas" class="game-canvas" width="400" height="200"></canvas>
            <div class="selected-numbers" id="selectedNumbersContainer"></div>
            <div style="font-size:11px; color:#888;">* 6개 선택</div>
            <div class="game-btn-group" style="display:flex; gap:8px; justify-content:center;">
                <button class="game-btn" style="background:#00e6b8; color:#000; border:none; border-radius:30px; padding:8px 16px;" onclick="resetTouchGame()">리셋</button>
                <button class="game-btn" id="saveComboBtn" style="background:#00e6b8; color:#000; border:none; border-radius:30px; padding:8px 16px;" onclick="saveTouchCombo()" disabled>저장</button>
            </div>
        </div>
        <div id="reactionGame" class="game-panel" style="display:none;">
            <div class="reaction-box" id="reactionBox" style="width:100%; height:120px; background:#222; border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; cursor:pointer; margin:10px 0;" onclick="handleReactionClick()">시작</div>
            <div class="reaction-result" id="reactionResult" style="font-size:13px; color:#ffd700; text-align:center;"></div>
            <div class="selected-numbers" id="reactionSelectedContainer"></div>
            <div class="game-btn-group" style="display:flex; gap:8px; justify-content:center;">
                <button class="game-btn" onclick="resetReactionGame()">리셋</button>
                <button class="game-btn" id="saveReactionBtn" onclick="saveReactionCombo()" disabled>저장</button>
                <button class="game-btn" onclick="startReaction()">새 게임</button>
            </div>
        </div>
    </div>
</div>

<!-- 당첨 확인 팝업 -->
<div id="reviewPopup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closeReviewPopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closeReviewPopup()">&times;</button>

        function getCorrelationScore(num) {

            for (let base of baseNumbers) {
                if (num % 10 === base % 10) score += 3;
                if (Math.abs(num % 10 - base % 10) === 1) score += 1;
                const section = n => n <= 15 ? 1 : n <= 30 ? 2 : 3;
                if (section(num) === section(base)) score += 2;
                if (Math.abs(num - base) <= 2) score += 2;
            }
            return score;

        function getParityBonus(num) {
            let odd = 0, even = 0;
            collectedRounds.forEach(r => {
                const row = FULL_DATA.find(x => x[0] === r);
                if (row) {
                    row.slice(1, 7).forEach(n => { if (n % 2 === 1) odd++; else even++; });
                }
            });
            if (odd + even === 0) return 0;
            if (num % 2 === 0 && even < odd) return 0.2;
            if (num % 2 === 1 && odd < even) return 0.2;
            return 0;
        }
        function getRecentAbsenceBonus(num) {
            let absence = referenceCount - (freqInCollected[num] || 0);
            return absence * 1.0;
        }
        function getTotalFreqBonus(num) {
            return totalFreq[num] * 0.05;

                if (n < 45 && !seen.has(n+1)) { pool.push(n+1); seen.add(n+1); }
            });
            const ends = allTargets.map(n => n % 10);
            for (let i = 1; i <= 45; i++) {
                if (ends.includes(i % 10) && !seen.has(i)) { pool.push(i); seen.add(i); }
            }
            let sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);
            sortedStats.slice(0, 5).forEach(([n]) => { let num = Number(n); if (!seen.has(num)) { pool.push(num); seen.add(num); } });
            sortedStats.slice(-5).forEach(([n]) => { let num = Number(n); if (!seen.has(num)) { pool.push(num); seen.add(num); } });

            let freqInCollected2 = {};
            collected.forEach(idx => {
                FULL_DATA[idx].slice(1, 7).forEach(n => freqInCollected2[n] = (freqInCollected2[n] || 0) + 1);
            });
            Object.entries(freqInCollected2).forEach(([n, cnt]) => {
                if (cnt >= 2 && !seen.has(Number(n))) { pool.push(Number(n)); seen.add(Number(n)); }
            });
            return pool.slice(0, 25).sort((a, b) => a - b);
        }

        exclude25 = getExclude25NumbersWithInterval();

        // ===== 모드별 14수 선정 =====
        if (currentMode === 'ai') {
            // AI 모드: 보너스, 25수, B바구니 소속 여부만으로 점수 계산 (기존 점수 사용 안 함)
            // 먼저 B바구니를 정의하기 위해 임시 14수가 필요 -> 제외수 모드(기존 방식, 보너스 가중치 없음)로 임시 14수 계산
            let tempFull14;
            if (exclude25.length <= 14) {
                tempFull14 = exclude25.slice();
            } else {
                let scored = exclude25.map(n => ({ n, score: weightedScore[n] }));
                scored.sort((a, b) => a.score - b.score || a.n - b.n);
                let lowGroup = scored.slice(0, 7).map(x => x.n);
                let highGroup = scored.slice(-7).map(x => x.n);
                tempFull14 = [...lowGroup, ...highGroup].sort((a, b) => a - b);
            }
            // B바구니: 생존수 중 tempFull14에 없고 보너스도 아닌 것
            let tempFull14Set = new Set(tempFull14);
            let bBag = survivors.filter(n => !tempFull14Set.has(n) && !bonusNums.includes(n));
            let bBagSet = new Set(bBag);
            let exclude25Set = new Set(exclude25);
            let bonusSetLocal = new Set(bonusNums);

            // 각 번호(1~45)에 대해 점수 계산
            let candidateScores = [];
            for (let num = 1; num <= 45; num++) {
                let score = 0;
                if (bonusSetLocal.has(num)) score += 100;
                if (exclude25Set.has(num)) score += 30;
                if (bBagSet.has(num)) score += 50;
                // 교집합 추가점수
                if (bonusSetLocal.has(num) && exclude25Set.has(num)) score += 20;
                if (bonusSetLocal.has(num) && bBagSet.has(num)) score += 30;
                if (exclude25Set.has(num) && bBagSet.has(num)) score += 10;
                candidateScores.push({ n: num, score });
            }
            // 점수 높은 순으로 정렬 후 상위 14개 선택
            candidateScores.sort((a, b) => b.score - a.score || a.n - b.n);
            let top14 = candidateScores.slice(0, 14).map(x => x.n).sort((a, b) => a - b);
            full14 = top14;
        } else {
            // 제외수 모드: 원본 방식 (하위7 + 상위7)
            if (exclude25.length <= 14) {
                full14 = exclude25.slice();
            } else {
                let scored = exclude25.map(n => ({ n, score: weightedScore[n] }));
                scored.sort((a, b) => a.score - b.score || a.n - b.n);
                let lowGroup = scored.slice(0, 7).map(x => x.n);
                let highGroup = scored.slice(-7).map(x => x.n);
                full14 = [...lowGroup, ...highGroup].sort((a, b) => a - b);
            }
        }

        // 14수 밖 전체 (middle) - 기존 정의 유지 (14수에 없고 보너스도 아닌 생존수)
        let full14Set = new Set(full14);
        middle = survivors.filter(n => !full14Set.has(n) && !bonusNums.includes(n)).sort((a,b)=>a-b);

        // 추천수 (압축수 기준) - 점수는 weightedScore를 사용 (표시용, 실제 순위는 weightedScore 기반)
        let full14WithScore = full14.map(n => ({ n, score: weightedScore[n] })).sort((a,b) => b.score - a.score || a.n - b.n);
        let full14Ranked = full14WithScore.map(x => x.n);
        let basket = full14Ranked.slice(0, currentCompress).sort((a,b)=>a-b);
        let basketSet = new Set(basket);
        let compressedOut4 = full14.filter(n => !basketSet.has(n));

        // 궁합 점수용 pairFrequency
        pairFrequency = {};
        collectedRounds.forEach(r => {
            const row = FULL_DATA.find(x => x[0] === r);
            if (row) {
                let nums = row.slice(1, 7);
                for (let i = 0; i < nums.length; i++) {
                    for (let j = i+1; j < nums.length; j++) {
                        let key = nums[i] < nums[j] ? nums[i]+','+nums[j] : nums[j]+','+nums[i];
                        pairFrequency[key] = (pairFrequency[key] || 0) + 1;
                    }
                }
            }
        });

        // 생존자 랭크
        let sortedSurvivors = survivors.map(n => ({n, s: weightedScore[n]})).sort((a,b) => b.s - a.s || a.n - b.n);
        survivorRankMap.clear();
        sortedSurvivors.forEach((item, index) => survivorRankMap.set(item.n, index + 1));

        let sums = collectedRounds.map(r => {
            let row = FULL_DATA.find(x => x[0] === r);
            return row ? row.slice(1,7).reduce((a,b)=>a+b,0) : 0;
        }).filter(s => s>0);
        dynamicAvgSum = sums.length ? Math.round(sums.reduce((a,b)=>a+b,0) / sums.length) : 145;

        // 헤더 업데이트
        document.getElementById('baseRoundInfo').innerHTML = prevData.slice(1, 7).map(n => `<span class="prev-num">${n}</span>`).join('') + '<span class="bonus-label">보너스</span>' + `<span class="prev-num">${prevData[7]}</span>`;
        document.getElementById('prevWinLabel').innerHTML = `📌 ${prev}회`;
        document.getElementById('roundDisplay').innerHTML = `-(${target}회)예상설정`;

        let winData = FULL_DATA.find(r => r[0] === target);
        let targetWinContainer = document.getElementById('targetWinContainer');
        if (!targetWinContainer) {
            targetWinContainer = document.createElement('div');
            targetWinContainer.id = 'targetWinContainer';
            targetWinContainer.className = 'target-win-container';
            document.querySelector('.header-line').appendChild(targetWinContainer);
        }
        if (winData) {
            targetWinContainer.style.display = 'flex';
            targetWinContainer.innerHTML = `<span class="target-win-label">${target}회당첨번호:</span><span class="target-win-numbers">${winData.slice(1, 7).join(',')},+${winData[7]}</span>`;
        } else {
            targetWinContainer.style.display = 'none';
        }
        document.getElementById('targetRound').innerText = target;
        document.getElementById('reviewTitle').innerHTML = `📊 ${target}회 복기`;

        let winSet = winData ? new Set(winData.slice(1, 7)) : new Set();

        function formatNum(num) {
            if (winData && winData[7] === num) return `<span style="color:#ff9933; font-weight:bold;">${num}</span>`;
            if (winSet.has(num)) return `<span style="color:#00ff00; font-weight:bold;">${num}</span>`;
            return `<span>${num}</span>`;
        }

        document.getElementById('status').innerHTML = `
            <div class="stat-row"><span class="stat-label">⚙️설정</span> <div class="number-group">간격 ${intervalWeeks}주 · ${referenceCount}개 회차 | 평균합 ${dynamicAvgSum}</div></div>
            <div class="stat-row"><span class="stat-label">👥생존</span> <div class="number-group">${survivors.map(formatNum).join(' ')}</div></div>
            <div class="stat-row"><span class="stat-label">🎯보너스</span> <div class="number-group">${bonusNums.map(formatNum).join(' ')}</div></div>
            <div class="stat-row"><span class="stat-label">🔢25수</span> <div class="number-group">${exclude25.map(formatNum).join(' ')}</div></div>
            <div class="stat-row"><span class="stat-label">📦B</span> <div class="number-group">${middle.map(formatNum).join(' ')}</div></div>
            <div class="stat-row"><span class="stat-label">🔢14수</span> <div class="number-group">${full14.map(n => {
                let rank = survivorRankMap.get(n) || '?';
                return winSet.has(n) ? `<span style="color:#00ff00; font-weight:bold;">${n}<sup class="rank-sup">${rank}</sup></span>` : `<span>${n}<sup class="rank-sup">${rank}</sup></span>`;
            }).join(' ')}</div></div>
            <div class="basket-large">⭐ 추천 ${basket.length}수: ${basket.map(formatNum).join(' ')}</div>
        `;

        // 고정수 UI 갱신
        renderFixedSelector(basket);
    }

    // ===== 고정수 UI 렌더링 =====
    function renderFixedSelector(basket) {
        const container = document.getElementById('fixedNumbersContainer');
        if (!container) return;
        if (!basket || basket.length === 0) {
            container.innerHTML = '<div style="color:#888;">추천수가 없습니다</div>';
            return;
        }
        let html = '';
        basket.forEach(num => {
            let checked = fixedSelected.includes(num) ? 'checked' : '';
            html += `
                <div class="fixed-number-item">
                    <label>
                        <input type="checkbox" value="${num}" ${checked} onchange="toggleFixed(${num}, this.checked)">
                        ${num}
                    </label>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function toggleFixed(num, checked) {
        if (checked) {
            if (fixedSelected.length >= MAX_FIXED) {
                alert(`고정수는 최대 ${MAX_FIXED}개까지 선택 가능합니다.`);
                document.querySelector(`#fixedNumbersContainer input[value="${num}"]`).checked = false;
                return;
            }
            if (!fixedSelected.includes(num)) {
                fixedSelected.push(num);
            }
        } else {
            fixedSelected = fixedSelected.filter(n => n !== num);
        }
        fixedSelected.sort((a,b)=>a-b);
    }

    function clearFixed() {
        fixedSelected = [];
        document.querySelectorAll('#fixedNumbersContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
    }

    // ===== 고정수 포함 조합 생성 =====
    function processWithFixed(limit) {
        analyze();
        if (fixedSelected.length === 0) {
            alert('고정수를 선택해주세요.');
            return;
        }
        if (fixedSelected.length > 6) {
            alert('고정수는 6개를 초과할 수 없습니다.');
            return;
        }
        let pool = full14.slice(0, currentCompress);
        if (pool.length < 6) pool = full14;
        for (let n of fixedSelected) {
            if (!pool.includes(n)) {
                alert(`고정수 ${n}이(가) 추천수 풀에 없습니다.`);
                return;
            }
        }

        generatedCombos = [];
        let used = new Set();

        for (let i = 0; i < limit; i++) {
            let combo = [...fixedSelected];
            let need = 6 - combo.length;
            let available = pool.filter(n => !combo.includes(n));
            if (available.length < need) {
                available = full14.filter(n => !combo.includes(n));
            }
            let shuffled = [...available].sort(() => Math.random() - 0.5);
            for (let j = 0; j < need && j < shuffled.length; j++) {
                combo.push(shuffled[j]);
            }
            while (combo.length < 6) {
                let extra = Math.floor(Math.random() * 45) + 1;
                if (!combo.includes(extra)) combo.push(extra);
            }
            combo.sort((a,b)=>a-b);
            let key = combo.join(',');
            if (!used.has(key)) {
                used.add(key);
                generatedCombos.push({ numbers: combo, key });
            } else {
                i--;
            }
        }
        showComboList();
    }

    // ===== 조합 생성 (기존, 궁합 쌍 + 보너스 50%) =====
    function process(limit) {
        analyze();
        generatedCombos = [];
        let used = new Set();
        let pool = full14.slice(0, currentCompress);
        if (pool.length < 6) pool = full14;
        if (!pool || pool.length < 6) { alert('조합 생성 불가'); return; }

        let bonusSetLocal = new Set(bonusNums);
        let bonusInFull14 = full14.filter(n => bonusSetLocal.has(n));

        for (let i = 0; i < limit; i++) {
            let combo = [];
            // 궁합 쌍 선택 (가장 높은 점수)
            let bestPair = null;
            let bestScore = -1;
            for (let a = 0; a < pool.length; a++) {
                for (let b = a+1; b < pool.length; b++) {
                    let key = pool[a] < pool[b] ? pool[a]+','+pool[b] : pool[b]+','+pool[a];
                    let score = pairFrequency[key] || 0;
                    if (score > bestScore) {
                        bestScore = score;
                        bestPair = [pool[a], pool[b]];
                    }
                }
            }
            if (bestPair) combo.push(...bestPair);
            else {
                let idx1 = Math.floor(Math.random() * pool.length);
                let idx2;
                do { idx2 = Math.floor(Math.random() * pool.length); } while (idx2 === idx1);
                combo.push(pool[idx1], pool[idx2]);
            }
            // 보너스 교집합 50%
            if (bonusInFull14.length > 0 && Math.random() < 0.5) {
                let candidates = bonusInFull14.filter(n => !combo.includes(n));
                if (candidates.length > 0) {
                    combo.push(candidates[Math.floor(Math.random() * candidates.length)]);
                }
            }
            // 나머지 채우기
            let remaining = pool.filter(n => !combo.includes(n));
            let shuffle = [...remaining].sort(() => Math.random() - 0.5);
            let need = 6 - combo.length;
            for (let j = 0; j < need && j < shuffle.length; j++) combo.push(shuffle[j]);
            while (combo.length < 6) {
                let extra = pool[Math.floor(Math.random() * pool.length)];
                if (!combo.includes(extra)) combo.push(extra);
            }
            combo.sort((a,b)=>a-b);
            let key = combo.join(',');
            if (!used.has(key)) {
                used.add(key);
                generatedCombos.push({ numbers: combo, key });
            } else i--;
        }
        showComboList();
    }

    // ===== 게임 함수 =====
    function openGamePopup() {

    function startTouchGame() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        canvas.width = 400; canvas.height = 200;
        touchGame = { ctx: canvas.getContext('2d'), width: canvas.width, height: canvas.height, numbers: [], highlightSet: new Set(full14) };
        for (let i = 1; i <= 45; i++) {
            touchGame.numbers.push({ num: i, x: Math.random() * (canvas.width - 30) + 15, y: Math.random() * (canvas.height - 30) + 15, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, radius: 12 });
        }
        touchSelected = [];
        updateTouchDisplay();
        if (touchInterval) cancelAnimationFrame(touchInterval);
        touchInterval = requestAnimationFrame(updateTouchGame);
    }
    function updateTouchGame() {
        if (!touchGame) return;
        const ctx = touchGame.ctx, w = touchGame.width, h = touchGame.height;
        ctx.clearRect(0, 0, w, h);
        touchGame.numbers.forEach(num => {
            num.x += num.vx; num.y += num.vy;
            if (num.x - num.radius < 0 || num.x + num.radius > w) { num.vx *= -1; num.x = Math.max(num.radius, Math.min(w - num.radius, num.x)); }
            if (num.y - num.radius < 0 || num.y + num.radius > h) { num.vy *= -1; num.y = Math.max(num.radius, Math.min(h - num.radius, num.y)); }
            ctx.beginPath(); ctx.arc(num.x, num.y, num.radius, 0, 2 * Math.PI);
            if (touchGame.highlightSet.has(num.num)) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.fillStyle = '#000'; }
            else { ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.fillStyle = '#000'; }
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px Malgun Gothic'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(num.num, num.x, num.y);
        });
        touchInterval = requestAnimationFrame(updateTouchGame);
    }
    document.addEventListener('touchstart', (e) => {
        if (!touchGame || document.getElementById('gamePopup').style.display !== 'flex' || !document.getElementById('touchGame').classList.contains('active')) return;
        const canvas = document.getElementById('gameCanvas'), rect = canvas.getBoundingClientRect(), touch = e.touches[0];
        const x = (touch.clientX - rect.left) * (canvas.width / rect.width), y = (touch.clientY - rect.top) * (canvas.height / rect.height);
        let touched = null, minDist = Infinity;
        touchGame.numbers.forEach(num => {
            const dx = num.x - x, dy = num.y - y, dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < num.radius && dist < minDist) { minDist = dist; touched = num.num; }
        });
        if (touched !== null && !touchSelected.includes(touched)) { touchSelected.push(touched); updateTouchDisplay(); }
        e.preventDefault();
    }, { passive: false });
    function updateTouchDisplay() {
        const container = document.getElementById('selectedNumbersContainer');
        container.innerHTML = touchSelected.map(n => `<div class="selected-ball">${n}</div>`).join('') || '<div style="color:#666;">터치해서 선택</div>';
        document.getElementById('saveComboBtn').disabled = touchSelected.length !== 6;
    }
    function resetTouchGame() {
        if (touchGame) {
            touchGame.numbers.forEach(num => {
                num.x = Math.random() * (touchGame.width - 30) + 15;
                num.y = Math.random() * (touchGame.height - 30) + 15;
                num.vx = (Math.random() - 0.5) * 2;
                num.vy = (Math.random() - 0.5) * 2;
            });
            touchSelected = []; updateTouchDisplay();
        }
    }
    function saveTouchCombo() { if (touchSelected.length === 6) { saveToBox([...touchSelected].sort((a,b)=>a-b).join(',')); touchSelected = []; updateTouchDisplay(); } }
    function updateReactionSelectedDisplay() {
        const container = document.getElementById('reactionSelectedContainer');
        container.innerHTML = reactionSelected.map(n => `<div class="selected-ball">${n}</div>`).join('') || '<div style="color:#666;">터치해서 번호를 뽑으세요</div>';
        document.getElementById('saveReactionBtn').disabled = reactionSelected.length !== 6;
    }
    function startReaction() {
        const box = document.getElementById('reactionBox');
        if (!box) return;
        reactionState = 'waiting';
        box.style.background = '#222';
        box.innerText = '기다리세요...';
        document.getElementById('reactionResult').innerText = '';
        const delay = Math.random() * 2000 + 1000;
        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            if (reactionState === 'waiting') {
                reactionState = 'ready';
                box.style.background = '#00aa00';
                box.innerText = '터치!';
                reactionStartTime = performance.now();
            }
        }, delay);
    }
    function handleReactionClick() {
        const box = document.getElementById('reactionBox'), result = document.getElementById('reactionResult');
        if (!box || !result) return;
        if (reactionState === 'ready') {
            const elapsed = performance.now() - reactionStartTime;
            const rnd = Math.floor(Math.random() * 45) + 1;
            result.innerText = `반응속도: ${elapsed.toFixed(0)}ms`;
            if (!reactionSelected.includes(rnd)) { reactionSelected.push(rnd); updateReactionSelectedDisplay(); }
            box.style.background = '#222';
            box.innerText = '다시 하려면 새 게임 버튼';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        } else if (reactionState === 'waiting') {
            result.innerText = '너무 빨랐어요! 다시 시작하세요.';
            box.style.background = '#222';
            box.innerText = '시작 버튼 누르기';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        }
    }
    function resetReactionGame() { reactionSelected = []; updateReactionSelectedDisplay(); startReaction(); }
    function saveReactionCombo() { if (reactionSelected.length === 6) { saveToBox([...reactionSelected].sort((a,b)=>a-b).join(',')); reactionSelected = []; updateReactionSelectedDisplay(); startReaction(); } }

    // ===== 복기 팝업 =====
    function openReviewPopup() {
        savedNumbers = JSON.parse(localStorage.getItem(`lottoSave_${userName}`)) || [];
        let w = FULL_DATA.find(r => r[0] === currentBaseRound);
        for (let i = 1; i <= 6; i++) document.getElementById(`win${i}`).value = w ? w[i] : '';
        document.getElementById('bonus').value = w ? w[7] : '';
        loadWinningNumbers();

        // reviewAIInfo 업데이트 (basket, compressedOut4 재계산)
        let reviewAI = document.getElementById('reviewAIInfo');
        if (reviewAI) {
            let winSet = w ? new Set(w.slice(1, 7)) : new Set();
            let format = n => winSet.has(n) ? `<span style="color:#00ff00;">${n}</span>` : `<span>${n}</span>`;

            // basket과 compressedOut4 계산
            let full14WithScore = full14.map(n => ({ n, score: weightedScore[n] })).sort((a,b) => b.score - a.score || a.n - b.n);
            let basket = full14WithScore.slice(0, currentCompress).map(x => x.n).sort((a,b)=>a-b);
            let basketSet = new Set(basket);
            let compressedOut4 = full14.filter(n => !basketSet.has(n));

            reviewAI.innerHTML = `
                <div>🔹 제외수25: ${exclude25.map(format).join(' ')}</div>
                <div>🔸 14수: ${full14.map(format).join(' ')}</div>
                <div>🔹 추천 ${basket.length}수: ${basket.map(format).join(' ')}</div>
                <div>🔸 미추천(14수 중): ${compressedOut4.map(format).join(' ')}</div>
                <div>🔹 14수 밖 전체: ${middle.map(format).join(' ')}</div>
            `;
        }

        const savedMatchDiv = document.getElementById('savedMatch');
        if (savedNumbers.length === 0) savedMatchDiv.innerHTML = '저장 조합 없음';
        else {
            let html = '';
            savedNumbers.forEach(key => {
                let nums = key.split(',').map(Number);
                let balls = nums.map(n => `<span class="selected-ball" style="width:30px; height:30px;">${n}</span>`).join('');
                html += `<div class="saved-combo-item">${balls}</div>`;
            });
            savedMatchDiv.innerHTML = html;
        }
        document.getElementById('reviewPopup').style.display = 'flex';
    }
    function closeReviewPopup() { document.getElementById('reviewPopup').style.display = 'none'; }
    function saveWinningNumbers() {
        let win = [1,2,3,4,5,6].map(i => parseInt(document.getElementById(`win${i}`).value));
        let bonus = parseInt(document.getElementById('bonus').value);
        if (win.some(isNaN) || isNaN(bonus)) { alert('모두 입력'); return; }
        localStorage.setItem('lastWinningNumbers', win.join(',')+'+'+bonus);
        showToast('✅ 저장');
    }
    function loadWinningNumbers() {
        let saved = localStorage.getItem('lastWinningNumbers');
        if (saved) {
            let parts = saved.split('+');
            let win = parts[0].split(',').map(Number);
            let bonus = parseInt(parts[1]);
            for (let i=1; i<=6; i++) document.getElementById(`win${i}`).value = win[i-1] || '';
            document.getElementById('bonus').value = bonus || '';
        }
    }
    function compareNumbers() {
        let win = [1,2,3,4,5,6].map(i => parseInt(document.getElementById(`win${i}`).value));
        let bonus = parseInt(document.getElementById('bonus').value);
        if (win.some(isNaN) || isNaN(bonus)) { alert('모두 입력'); return; }
        let winSet = new Set(win);
        let saved = savedNumbers.map(k => k.split(',').map(Number));
        let resultHtml = '<h4>저장 조합 비교</h4>';
        if (saved.length === 0) resultHtml += '<p>저장 없음</p>';
        else {
            saved.forEach(nums => {
                let match = nums.filter(n => winSet.has(n)).length;
                let hasBonus = nums.includes(bonus);
                let rank = match === 6 ? '1등' : match===5 && hasBonus ? '2등' : match===5 ? '3등' : match===4 ? '4등' : match===3 ? '5등' : '꽝';
                resultHtml += `<div>${nums.join(', ')} → ${match}개 ${rank}</div>`;
            });
        }
        document.getElementById('reviewResult').innerHTML = resultHtml;
    }

    // ===== 회차별 비교 (간략) =====
    function openComparisonPopup() { alert('회차별 비교는 준비 중입니다.'); }

    // ===== 초기 실행 =====
    window.onload = function() {
        initUser();
        document.getElementById('intervalWeeks').value = intervalWeeks;
        document.getElementById('refCount').value = referenceCount;
        document.getElementById('baseRoundInput').value = currentBaseRound;
        document.getElementById('compressSlider').value = currentCompress;
        document.getElementById('compressValue').innerText = currentCompress;
        analyze();
    };
</script>
