<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON - 게임 완전 정상화</title>
    <style>
        /* 모든 스타일은 이전과 동일 (생략하지 않고 유지) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            padding: 2px;
        }
        .outer-border {
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 4px;
            max-width: 480px;
            margin: 0 auto;
        }
        .header-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 2px 4px;
            margin-bottom: 4px;
            font-size: 8px;
        }
        .prev-info {
            display: flex;
            align-items: center;
            gap: 2px;
            color: #aaa;
        }
        .base-num-box {
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            font-size: 6px;
            font-weight: 800;
            border-radius: 50%;
            background: #111;
            color: #ffd700;
            border: 1px solid #ffd700;
        }
        .title-main {
            font-weight: 800;
            background: linear-gradient(135deg, #fff8e0, #ffe68f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 10px;
        }
        .round-text {
            color: #ffd700;
            font-weight: 900;
            font-size: 11px;
        }
        .user-info {
            background: #222;
            color: #00e6b8;
            padding: 2px 6px;
            border-radius: 30px;
            font-size: 7px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .change-name-btn {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 1px 4px;
            font-size: 6px;
            cursor: pointer;
            height: 14px;
            line-height: 1;
        }
        .status-info {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 4px;
            margin: 4px 0;
            border: 1px solid #333;
            font-size: 7px;
            line-height: 1.3;
            max-height: 140px;
            overflow-y: auto;
            color: #fff;
            white-space: normal;
        }
        .stat-row {
            display: flex;
            align-items: baseline;
            gap: 2px;
            margin: 1px 0;
            flex-wrap: wrap;
        }
        .stat-label {
            color: #00e6b8;
            font-weight: 600;
            font-size: 6px;
            min-width: 30px;
        }
        .number-group {
            display: inline;
            font-size: 5px;
            word-break: break-word;
            white-space: nowrap;
        }
        .number-group span {
            margin-right: 1px;
        }
        .ai-number { font-size: 8px; font-weight: bold; }
        .full14-number { font-size: 6px; }
        .b-number { font-size: 5px; }
        .survivor-number { font-size: 4px; }
        .winning-num { color: #2ecc71 !important; font-weight: bold; }
        .replaced-in-text { color: #ff6b6b !important; font-weight: bold; }
        .replaced-out-text { color: #6ba6ff !important; font-weight: bold; }
        .bonus-text { color: #aaa; }

        .control-panel {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 3px 5px;
            margin: 4px 0;
            border: 1px solid #333;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 5px;
            flex-wrap: wrap;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 3px;
            background: #222;
            padding: 2px 6px;
            border-radius: 30px;
        }
        .setting-item span {
            color: #ffd700;
            font-size: 7px;
        }
        .setting-item input {
            width: 40px;
            height: 24px;
            background: #333;
            border: 1px solid #00e6b8;
            color: white;
            border-radius: 30px;
            text-align: center;
            font-size: 8px;
            margin: 0 2px;
        }
        .step-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            margin: 0;
            font-size: 18px;
            line-height: 1;
            box-shadow: 0 0 4px rgba(255,215,0,0.5);
        }
        .step-btn:active {
            background: #ffd700;
            color: #000;
        }
        .apply-btn {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            height: 28px;
        }

        .round-selector {
            margin: 4px 0;
            text-align: center;
        }
        .base-round-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .round-control {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #222;
            padding: 2px 6px;
            border-radius: 30px;
        }
        .round-control input {
            width: 55px;
            height: 28px;
            background: #333;
            border: 1px solid #ffd700;
            color: white;
            border-radius: 30px;
            text-align: center;
            font-size: 9px;
        }
        .round-control .step-btn {
            border-color: #ffd700;
            color: #ffd700;
            width: 28px;
            height: 28px;
            font-size: 18px;
        }
        .base-round-input button {
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 0 14px;
            height: 28px;
            font-size: 8px;
            font-weight: bold;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2px;
            margin: 4px 0 2px;
        }
        button {
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            height: 28px;
            font-size: 8px;
            padding: 0 3px;
        }
        .btn-5set { background: linear-gradient(145deg, #00e6b8, #00a884); color: #000; }
        .btn-main { background: linear-gradient(145deg, #ffd700, #b8860b); color: #000; }
        .btn-sub { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
        .btn-reset { grid-column: span 3; background: #333; color: #aaa; height: 24px; font-size: 7px; }
        .btn-review { grid-column: span 3; background: linear-gradient(145deg, #ff69b4, #c71585); color: white; height: 28px; font-size: 8px; }

        .small-note {
            color: #aaa;
            font-size: 6px;
            text-align: center;
            margin-top: 2px;
        }

        /* 게임 팝업 */
        .game-tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .game-tab { flex: 1; background: #222; color: #aaa; border: 1px solid #444; border-radius: 5px; padding: 4px 0; font-size: 8px; cursor: pointer; text-align: center; }
        .game-tab.active { background: #00e6b8; color: #000; font-weight: bold; border-color: #00e6b8; }
        .game-panel { display: none; }
        .game-panel.active { display: block; }
        .game-canvas { width: 100%; height: 180px; background: #1a1a1a; border-radius: 8px; border: 1px solid #444; margin: 4px 0; touch-action: none; }
        .selected-numbers { display: flex; gap: 4px; justify-content: center; margin: 4px 0; flex-wrap: wrap; }
        .selected-ball { width: 24px; height: 24px; border-radius: 50%; background: #000; border: 2px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 9px; }
        .game-btn-group { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
        .game-btn { background: #00e6b8; color: #000; border: none; border-radius: 12px; padding: 4px 8px; font-size: 7px; font-weight: bold; cursor: pointer; height: 24px; }
        .game-btn:disabled { opacity: 0.5; background: #444; color: #aaa; cursor: not-allowed; }
        .reaction-box { width: 100%; height: 100px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; cursor: pointer; margin: 4px 0; border: 1px solid #444; }
        .reaction-result { margin-top: 2px; font-size: 8px; color: #ffd700; text-align: center; }

        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .popup-content {
            background: #1a1a1a;
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 10px;
            max-width: 360px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .popup-close {
            position: absolute;
            top: 2px; right: 4px;
            font-size: 14px;
            background: none;
            border: none;
            color: #ffd700;
            cursor: pointer;
            z-index: 1100;
            padding: 4px 8px;
        }
        .popup-title { font-size: 10px; margin-bottom: 6px; color: #ffd700; text-align: center; }
        .winning-display { font-size: 8px; color: #ffd700; margin-bottom: 8px; text-align: center; }
        .ai-info-box { 
            font-size: 7px; 
            background: #222; 
            padding: 6px; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            border: 1px solid #444;
            line-height: 1.4;
        }
        .ai-info-box div { margin: 3px 0; }
        .winning-input {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .winning-input input {
            width: 30px;
            height: 30px;
            background: #222;
            border: 1px solid #444;
            border-radius: 50%;
            font-size: 9px;
            text-align: center;
            color: #fff;
        }
        .bonus-section {
            text-align: center;
            margin: 8px 0;
        }
        .bonus-section .winning-input {
            margin-top: 4px;
        }
        .bonus-section .winning-input input {
            width: 30px;
            height: 30px;
        }
        .btn-compare {
            display: block;
            width: fit-content;
            margin: 6px auto 4px;
            background: #00e6b8;
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px;
            margin-top: 6px;
            font-size: 8px;
        }
        .result-box div { margin: 4px 0; }
        .match-count { font-size: 10px; color: #ffd700; }
        .combo-item {
            display: flex;
            justify-content: space-between;
            padding: 3px;
            border-bottom: 1px solid #333;
            font-size: 8px;
        }
        .combo-item:last-child { border-bottom: none; }
        #savedMatch {
            max-height: 160px;
            overflow-y: auto;
        }

        .toast {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 9999;
            display: none;
            pointer-events: none;
        }
        .toast span {
            background: #333;
            color: #ffd700;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="outer-border">
    <div class="header-line">
        <div class="prev-info">
            <span id="prevWinLabel">📌 1212회</span>
            <span id="baseRoundInfo"></span>
        </div>
        <span class="title-main">SHIN-UI-SON</span>
        <span class="round-text" id="roundDisplay">1213 설정</span>
        <span id="userDisplay" class="user-info"></span>
    </div>

    <div id="status" class="status-info">로딩 중...</div>

    <div class="control-panel">
        <div class="setting-row">
            <div class="setting-item">
                <span>간격</span>
                <button class="step-btn" onclick="stepInterval(-1)">−</button>
                <input type="number" id="intervalWeeks" min="1" max="30" value="1" step="1">
                <button class="step-btn" onclick="stepInterval(1)">+</button>
                <span>주</span>
            </div>
            <div class="setting-item">
                <span>회차 수</span>
                <button class="step-btn" onclick="stepRefCount(-1)">−</button>
                <input type="number" id="refCount" min="1" max="30" value="10" step="1">
                <button class="step-btn" onclick="stepRefCount(1)">+</button>
                <span>개</span>
            </div>
            <button class="apply-btn" onclick="applyAnalysisSettings()">적용</button>
        </div>
    </div>

    <div class="round-selector" style="margin-top: 8px; margin-bottom: 8px;">
        <div class="base-round-input">
            <div class="round-control">
                <button class="step-btn" onclick="stepBaseRound(-1)">−</button>
                <input type="number" id="baseRoundInput" min="901" max="1300" value="1213" step="1">
                <button class="step-btn" onclick="stepBaseRound(1)">+</button>
            </div>
            <button onclick="setBaseRound()" style="margin-left: 4px;">회차 설정</button>
        </div>
    </div>

    <div class="btn-group" style="margin-top: 8px;">
        <button class="btn-5set" onclick="process(5)">5조합</button>
        <button class="btn-main" onclick="process(10)">10조합</button>
        <button class="btn-sub" onclick="openPopup()">보관함</button>
        <button class="btn-sub" onclick="openGamePopup()">🎮 게임</button>
        <button class="btn-sub" onclick="clearStorage()">초기화</button>
        <button class="btn-sub" onclick="location.reload()">⟳</button>
        <button class="btn-review" onclick="openReviewPopup()">📊 당첨확인</button>
        <button class="btn-sub" style="grid-column: span 3;" onclick="showComboList()">📋 생성 조합</button>
    </div>

    <div class="small-note">🎯 <span id="targetRound">1213</span> 예상 (10수 엔진) · 14수 표시</div>
</div>

<div class="toast" id="toast"><span>✅ 저장됨</span></div>

<!-- 보관함 팝업 -->
<div id="popup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closePopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closePopup()">&times;</button>
        <div class="popup-title">📦 보관함</div>
        <div id="storage"></div>
    </div>
</div>

<!-- 게임 팝업 - 터치 게임 완전 수정, 닫기 버튼 강화 -->
<div id="gamePopup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closeGamePopup()">
    <div class="popup-content" style="max-width:420px;">
        <button class="popup-close" onclick="closeGamePopup(); event.stopPropagation();">&times;</button>
        <div class="popup-title">🎮 게임센터</div>
        <div class="game-tabs">
            <button class="game-tab active" data-game="touch" onclick="switchGame('touch')">터치 러쉬</button>
            <button class="game-tab" data-game="reaction" onclick="switchGame('reaction')">반응속도</button>
        </div>
        <div id="touchGame" class="game-panel active">
            <canvas id="gameCanvas" class="game-canvas" width="400" height="200" style="touch-action: none;"></canvas>
            <div class="selected-numbers" id="selectedNumbersContainer"></div>
            <div style="font-size:6px; color:#888;">* 공을 터치하면 선택 (최대 6개)</div>
            <div class="game-btn-group">
                <button class="game-btn" onclick="resetTouchGame()">리셋</button>
                <button class="game-btn" id="saveComboBtn" onclick="saveTouchCombo()" disabled>조합 저장</button>
            </div>
        </div>
        <div id="reactionGame" class="game-panel">
            <div style="text-align: center;">
                <div class="reaction-box" id="reactionBox" onclick="handleReactionClick()">시작하려면 누르세요</div>
                <div class="reaction-result" id="reactionResult"></div>
                <div class="selected-numbers" id="reactionSelectedContainer"></div>
                <div style="font-size:6px; color:#888;">* 반응 후 자동 생성된 번호 저장 가능</div>
                <div class="game-btn-group">
                    <button class="game-btn" onclick="resetReactionGame()">리셋</button>
                    <button class="game-btn" id="saveReactionBtn" onclick="saveReactionCombo()" disabled>조합 저장</button>
                    <button class="game-btn" onclick="startReaction()">새 게임</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 당첨확인 팝업 (개선) -->
<div id="reviewPopup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closeReviewPopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closeReviewPopup()">&times;</button>
        <div class="popup-title" id="reviewTitle">📊 복기</div>
        <div class="winning-display" id="winningDisplay"></div>
        <div class="ai-info-box" id="reviewAIInfo"></div>
        
        <div class="winning-input">
            <input type="number" id="win1" min="1" max="45" step="1" placeholder="1">
            <input type="number" id="win2" min="1" max="45" step="1" placeholder="2">
            <input type="number" id="win3" min="1" max="45" step="1" placeholder="3">
            <input type="number" id="win4" min="1" max="45" step="1" placeholder="4">
            <input type="number" id="win5" min="1" max="45" step="1" placeholder="5">
            <input type="number" id="win6" min="1" max="45" step="1" placeholder="6">
        </div>
        
        <div class="bonus-section">
            <div>보너스 번호</div>
            <div class="winning-input">
                <input type="number" id="bonus" min="1" max="45" step="1" placeholder="보너스">
            </div>
        </div>
        
        <button class="btn-compare" onclick="compareNumbers()">비교하기</button>
        
        <div id="reviewResult" class="result-box">
            <div>AI 추천 10수와 비교:</div>
            <div id="aiMatch" class="match-count">-</div>
            <div id="aiMatchedList" style="color: #ffd700;"></div>
            <div id="aiBonus" style="color: #aaa;"></div>
            <div style="margin-top: 6px;">보관함 조합 비교:</div>
            <div id="savedMatch" style="max-height: 160px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<!-- 조합 목록 팝업 -->
<div id="comboListPopup" class="popup-overlay" style="display:none;" onclick="if(event.target===this) closeComboListPopup()">
    <div class="popup-content">
        <button class="popup-close" onclick="closeComboListPopup()">&times;</button>
        <div class="popup-title">📋 조합 목록</div>
        <div style="text-align:right;"><button class="combo-save-btn" onclick="saveAllCombos()">📥 모두 저장</button></div>
        <div id="comboListContent" class="combo-list"></div>
    </div>
</div>

        bonusWR.forEach(it => score[it.num] = (score[it.num] || 0) + it.weight);

        // 보너스 추가 가산점
        let bonusCount = {};
        bonusWR.forEach(it => bonusCount[it.num] = (bonusCount[it.num] || 0) + 1);
        for (let num in bonusCount) {
            if (bonusCount[num] >= 2) score[num] = (score[num] || 0) + 0.2;
            if (bonusCount[num] >= 3) score[num] = (score[num] || 0) + 0.3;
        }
        // 미출수 가산점
        zeroFreqNums.forEach(num => {
            if (score[num] !== undefined) score[num] += 0.2;
        });
        // 최근 출현 빈도 가산점 (최근 5회차 내 2회 이상)
        let recentFreq = {};
        for (let i = 1; i <= Math.min(5, referenceCount); i++) {
            const round = target - intervalWeeks * i;
            const row = FULL_DATA.find(x => x[0] === round);
            if (row) {
                row.slice(1, 7).forEach(num => recentFreq[num] = (recentFreq[num] || 0) + 1);
            }
        }
        for (let num = 1; num <= 45; num++) {
            if (recentFreq[num] >= 2) score[num] = (score[num] || 0) + 0.2;
        }

        let ranked = Object.keys(score).map(Number).sort((a, b) => (score[b] || 0) - (score[a] || 0) || a - b);
        let top8 = ranked.slice(0, 8), bottom6 = ranked.slice(-6);
        full14 = Array.from(new Set([...top8, ...bottom6])).sort((a, b) => a - b);
        let top6 = ranked.slice(0, 6), bottom4 = ranked.slice(-4);
        let initBasket = Array.from(new Set([...top6, ...bottom4])).sort((a, b) => a - b);
        survivors = Array.from(new Set([...mainPool, ...bonusPool])).sort((a, b) => a - b);
        bonusNums = Array.from(new Set(bonusPool)).sort((a, b) => a - b);
        let out4 = full14.filter(n => !new Set(initBasket).has(n));

        // 교체 로직
        let cand = out4.filter(n => lastWinning.includes(n));
        if (cand.length < 2) {
            let so = out4.sort((a, b) => (score[b] || 0) - (score[a] || 0));
            for (let n of so) if (!cand.includes(n) && cand.length < 2) cand.push(n);
        }
        cand = [...new Set(cand)].slice(0, 2);

        if (cand.length > 0) {
            let bs = initBasket.map(n => ({ num: n, score: score[n] || 0 })).sort((a, b) => a.score - b.score);
            let low = bs.slice(0, cand.length).map(it => it.num);
            let nb = [...initBasket];
            for (let i = 0; i < cand.length; i++) {
                let idx = nb.indexOf(low[i]);
                if (idx !== -1) nb[idx] = cand[i];
            }
            nb = [...new Set(nb)].sort((a, b) => a - b);
            if (nb.length === initBasket.length) {
                basket = nb;
                compressedOut4 = out4.filter(n => !cand.includes(n));
                middle = survivors.filter(n => !full14.includes(n));
                middle = [...middle, ...low].filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
                replacedIn = cand;
                replacedOut = low;
            } else {
                basket = initBasket;
                compressedOut4 = out4;
                middle = survivors.filter(n => !full14.includes(n));
                replacedIn = []; replacedOut = [];
            }
        } else {
            basket = initBasket;
            compressedOut4 = out4;
            middle = survivors.filter(n => !full14.includes(n));
            replacedIn = []; replacedOut = [];
        }

        // 합계 평균
        let sums = tRounds.map(r => {
            let rr = FULL_DATA.find(x => x[0] === r);
            return rr ? rr.slice(1, 7).reduce((a, b) => a + b, 0) : 0;
        }).filter(s => s > 0);
        dynamicAvgSum = sums.length ? Math.round(sums.reduce((a, b) => a + b, 0) / sums.length) : 145;

        // UI 업데이트
        document.getElementById('baseRoundInfo').innerHTML = p.slice(1, 7).map(n => `<span class="base-num-box">${n}</span>`).join('') + '<span class="bonus-label">보너스</span>' + `<span class="base-num-box">${p[7]}</span>`;
        document.getElementById('prevWinLabel').innerHTML = `📌 ${prev}회`;
        document.getElementById('roundDisplay').innerHTML = `${target} 설정`;
        document.getElementById('targetRound').innerText = target;
        document.getElementById('reviewTitle').innerHTML = `📊 ${target}회 복기`;

        let winData = FULL_DATA.find(r => r[0] === target);
        let winSet = winData ? new Set(winData.slice(1, 7)) : new Set();
        let middleWithoutBonus = middle.filter(n => !bonusNums.includes(n));

        function formatText(arr, isAI = false, isFull14 = false, isB = false, isSurvivor = false) {
            return arr.map(n => {
                let cls = '';
                if (winSet.has(n)) cls = 'winning-num';
                else if (replacedIn.includes(n)) cls = 'replaced-in-text';
                else if (replacedOut.includes(n)) cls = 'replaced-out-text';
                let extra = '';
                if (isAI) extra = 'ai-number';
                else if (isFull14) extra = 'full14-number';
                else if (isB) extra = 'b-number';
                else if (isSurvivor) extra = 'survivor-number';
                return `<span class="${cls} ${extra}">${n}</span>`;
            }).join(' ');
        }

        document.getElementById('status').innerHTML = `
            <div class="stat-row"><span class="stat-label">⚙️설정</span> 간격 ${intervalWeeks}주 · ${referenceCount}개 회차 | 평균합 ${dynamicAvgSum}</div>
            <div class="stat-row"><span class="stat-label">👥생존</span> <span class="number-group">${formatText(survivors, false, false, false, true)}</span></div>
            <div class="stat-row"><span class="stat-label">🎯보너스</span> <span class="number-group">${formatText(bonusNums)}</span></div>
            <div class="stat-row"><span class="stat-label">📦B</span> <span class="number-group">${middleWithoutBonus.length ? formatText(middleWithoutBonus, false, false, true) : '<span class="bonus-text">없음</span>'}</span></div>
            <div class="stat-row"><span class="stat-label">🔢14수</span> <span class="number-group">${formatText(full14, false, true)}</span></div>
            <div class="stat-row"><span class="stat-label">🤖AI10</span> <span class="number-group">${formatText(basket, true)}</span></div>
            <div class="stat-row"><span class="stat-label">🔻빠진</span> <span class="number-group">${formatText(compressedOut4)}</span></div>
            <div class="stat-row"><span class="stat-label">▶</span> <span class="number-group">${replacedIn.map(n => `<span class="replaced-in-text">${n}</span>`).join(' ') || '없음'}</span> <span class="stat-label">◀</span> <span class="number-group">${replacedOut.map(n => `<span class="replaced-out-text">${n}</span>`).join(' ') || '없음'}</span></div>
            ${winData ? `<div class="stat-row"><span class="stat-label">✅${target}</span> <span class="number-group">${winData.slice(1, 7).map(n => `<span class="winning-num">${n}</span>`).join(' ')}</span> <span class="bonus-label">보너스</span> <span class="winning-num">${winData[7]}</span></div>` : ''}
        `;
    }

    function process(limit) {
        analyze();
        generatedCombos = [];
        let used = new Set();

        if (limit === 10) {
            for (let i = 0; i < limit; i++) {
                let combo = new Set();
                let pool = (i % 2 === 0) ? full14 : basket;
                let available = [...pool];
                if (compressedOut4.length) {
                    let special = compressedOut4[Math.floor(Math.random() * compressedOut4.length)];
                    combo.add(special);
                    available = available.filter(n => n !== special);
                }
                let shuffled = available.sort(() => Math.random() - 0.5);
                for (let n of shuffled) if (combo.size < 6) combo.add(n);
                if (combo.size < 6) {
                    let all = [...new Set([...pool, ...compressedOut4])].sort(() => Math.random() - 0.5);
                    for (let n of all) { combo.add(n); if (combo.size === 6) break; }
                }
                let arr = Array.from(combo).sort((a, b) => a - b);
                let key = arr.join(',');
                if (!used.has(key)) { used.add(key); generatedCombos.push({ numbers: arr, key }); }
                else i--;
            }
        } else {
            let cnt = 0, safe = 0;
            while (cnt < limit && safe < 50000) {
                safe++;
                let res = new Set();
                let items = basket.map(n => ({ num: n, weight: weightedScore[n] || 1 }));
                let order = [];
                while (items.length) {
                    let total = items.reduce((s, i) => s + i.weight, 0);
                    let r = Math.random() * total, cum = 0;
                    for (let i = 0; i < items.length; i++) {
                        cum += items[i].weight;
                        if (r < cum) { order.push(items[i].num); items.splice(i, 1); break; }
                    }
                }
                for (let n of order) if (res.size < 6) res.add(n);
                while (res.size < 6) res.add(basket[Math.floor(Math.random() * basket.length)]);
                let arr = Array.from(res).sort((a, b) => a - b);
                let key = arr.join(',');
                if (!used.has(key)) { used.add(key); cnt++; generatedCombos.push({ numbers: arr, key }); }
            }
        }
        showComboList();
    }

            return;
        }

        const winSet = new Set(winning);

    function startTouchGame() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        // 캔버스 크기 명시적 설정 (CSS와 일치)
        canvas.width = 400;
        canvas.height = 200;
        // 기존 게임 객체 초기화
        touchGame = {
            ctx: canvas.getContext('2d'),
            width: canvas.width,
            height: canvas.height,
            numbers: [],
            highlightSet: new Set(basket) // 현재 AI 추천 번호 하이라이트
        };
        // 45개 공 생성 (약간 느리게 움직이도록)
        for (let i = 1; i <= 45; i++) {
            touchGame.numbers.push({
                num: i,
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: 14
            });
        }
        touchSelected = [];
        updateTouchDisplay();
        if (touchInterval) cancelAnimationFrame(touchInterval);
        touchInterval = requestAnimationFrame(updateTouchGame);
    }

    function updateTouchGame() {
        if (!touchGame) return;
        const ctx = touchGame.ctx;
        const w = touchGame.width;
        const h = touchGame.height;
        ctx.clearRect(0, 0, w, h);
        touchGame.numbers.forEach(num => {
            // 위치 업데이트
            num.x += num.vx;
            num.y += num.vy;
            // 벽 충돌 처리
            if (num.x - num.radius < 0 || num.x + num.radius > w) {
                num.vx *= -1;
                num.x = Math.max(num.radius, Math.min(w - num.radius, num.x));
            }
            if (num.y - num.radius < 0 || num.y + num.radius > h) {
                num.vy *= -1;
                num.y = Math.max(num.radius, Math.min(h - num.radius, num.y));
            }
            // 공 그리기
            ctx.beginPath();
            ctx.arc(num.x, num.y, num.radius, 0, 2 * Math.PI);
            // 선택된 공은 금색, AI 추천 공은 테두리 굵게
            if (touchSelected.includes(num.num)) {
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
            } else if (touchGame.highlightSet.has(num.num)) {
                ctx.fillStyle = '#333';
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
            } else {
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
            }
            ctx.fill();
            ctx.stroke();
            // 숫자 그리기
            ctx.fillStyle = touchSelected.includes(num.num) ? '#000' : '#ffd700';
            ctx.font = 'bold 10px Malgun Gothic';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num.num, num.x, num.y);
        });
        touchInterval = requestAnimationFrame(updateTouchGame);
    }

    // 터치 이벤트 처리 (canvas 위에서만)
    function handleCanvasTouch(e) {
        e.preventDefault(); // 스크롤 방지
        const canvas = document.getElementById('gameCanvas');
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touchX = (touch.clientX - rect.left) * scaleX;
        const touchY = (touch.clientY - rect.top) * scaleY;
        
        // 어떤 공이 터치되었는지 찾기
        let minDist = Infinity;
        let touchedNum = null;
        touchGame.numbers.forEach(num => {
            const dx = num.x - touchX;
            const dy = num.y - touchY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < num.radius && dist < minDist) {
                minDist = dist;
                touchedNum = num.num;
            }
        });
        if (touchedNum !== null) {
            // 선택/해제
            const idx = touchSelected.indexOf(touchedNum);
            if (idx === -1) {
                if (touchSelected.length < 6) touchSelected.push(touchedNum);
            } else {
                touchSelected.splice(idx, 1);
            }
            updateTouchDisplay();
        }
    }

    // 캔버스에 터치 이벤트 리스너 등록 (매번 새로 등록하지 않도록 주의)
    function setupTouchCanvas() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        // 기존 리스너 제거 후 새로 등록 (중복 방지)
        canvas.removeEventListener('touchstart', handleCanvasTouch);
        canvas.addEventListener('touchstart', handleCanvasTouch, { passive: false });
    }

    // 게임 시작 시 캔버스 이벤트 설정
    function startTouchGame() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        canvas.width = 400;
        canvas.height = 200;
        touchGame = {
            ctx: canvas.getContext('2d'),
            width: canvas.width,
            height: canvas.height,
            numbers: [],
            highlightSet: new Set(basket)
        };
        for (let i = 1; i <= 45; i++) {
            touchGame.numbers.push({
                num: i,
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: 14
            });
        }
        touchSelected = [];
        updateTouchDisplay();
        setupTouchCanvas(); // 캔버스 터치 이벤트 연결
        if (touchInterval) cancelAnimationFrame(touchInterval);
        touchInterval = requestAnimationFrame(updateTouchGame);
    }

    function updateTouchDisplay() {
        const container = document.getElementById('selectedNumbersContainer');
        if (touchSelected.length === 0) {
            container.innerHTML = '<div style="color:#666; font-size:7px;">공을 터치하여 선택하세요</div>';
        } else {
            container.innerHTML = touchSelected.map(n => `<div class="selected-ball">${n}</div>`).join('');
        }
        document.getElementById('saveComboBtn').disabled = touchSelected.length !== 6;
    }

    function resetTouchGame() {
        if (touchGame) {
            touchGame.numbers.forEach(num => {
                num.x = Math.random() * (touchGame.width - 40) + 20;
                num.y = Math.random() * (touchGame.height - 40) + 20;
                num.vx = (Math.random() - 0.5) * 1.5;
                num.vy = (Math.random() - 0.5) * 1.5;
            });
            touchSelected = [];
            updateTouchDisplay();
        }
    }

    function saveTouchCombo() {
        if (touchSelected.length === 6) {
            const sorted = [...touchSelected].sort((a, b) => a - b);
            saveToBox(sorted.join(','));
            touchSelected = [];
            updateTouchDisplay();
        }
    }

    // 반응속도 게임 함수 (기존과 동일)
    function updateReactionSelectedDisplay() {
        const container = document.getElementById('reactionSelectedContainer');
        if (reactionSelected.length === 0) {
            container.innerHTML = '<div style="color:#666; font-size:7px;">반응 후 번호가 생성됩니다</div>';
        } else {
            container.innerHTML = reactionSelected.map(n => `<div class="selected-ball">${n}</div>`).join('');
        }
        document.getElementById('saveReactionBtn').disabled = reactionSelected.length !== 6;
    }

    function startReaction() {
        const box = document.getElementById('reactionBox');
        if (!box) return;
        reactionState = 'waiting';
        box.style.background = '#222';
        box.innerText = '초록색이 되면 누르세요...';
        document.getElementById('reactionResult').innerText = '';
        const delay = Math.random() * 2000 + 1000;
        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            if (reactionState === 'waiting') {
                reactionState = 'ready';
                box.style.background = '#00aa00';
                box.innerText = '지금 누르세요!';
                reactionStartTime = performance.now();
            }
        }, delay);
    }

    function handleReactionClick() {
        const box = document.getElementById('reactionBox');
        const result = document.getElementById('reactionResult');
        if (!box || !result) return;
        if (reactionState === 'ready') {
            const elapsed = performance.now() - reactionStartTime;
            const randomNum = Math.floor(Math.random() * 45) + 1;
            result.innerText = `반응속도: ${elapsed.toFixed(0)}ms`;
            if (!reactionSelected.includes(randomNum)) {
                reactionSelected.push(randomNum);
                updateReactionSelectedDisplay();
            }
            box.style.background = '#222';
            box.innerText = '다시 하려면 새 게임 버튼';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        } else if (reactionState === 'waiting') {
            result.innerText = '너무 빨랐어요! 다시 시작하세요.';
            box.style.background = '#222';
            box.innerText = '시작 버튼 누르기';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        }
    }

    function resetReactionGame() {
        reactionSelected = [];
        updateReactionSelectedDisplay();
        startReaction();
    }

    function saveReactionCombo() {
        if (reactionSelected.length === 6) {
            const sorted = [...reactionSelected].sort((a, b) => a - b);
            saveToBox(sorted.join(','));
            reactionSelected = [];
            updateReactionSelectedDisplay();
            startReaction();
        }
    }

    window.onload = function () { initUser(); analyze(); };
</script>
</body>
</html>
