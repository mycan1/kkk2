    function getWinning(round) {
        const row = DATA.find(r => r[0] === round);
        return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
    }

    // ========================================================================
    // 📊 당첨경과 조회
    // ========================================================================
    function getNumberHistory(num, targetRound, historyCount) {
        const history = [];
        let hitCount = 0;
        let missCount = 0;
        
        for (let i = 1; i <= historyCount; i++) {
            const round = targetRound - i;
            if (round < 1000) break;
            
            const win = getWinning(round);
            if (win) {
                const isHit = win.main.includes(num);
                const isBonus = win.bonus === num;
                if (isHit || isBonus) {
                    history.push({ round, hit: true, bonus: isBonus });
                    hitCount++;
                } else {
                    history.push({ round, hit: false, bonus: false });
                    missCount++;
                }
            }
        }
        
        return {
            history,
            hitCount,
            missCount,
            total: history.length,
            hitRate: history.length > 0 ? Math.round((hitCount / history.length) * 100) : 0
        };
    }

    // ========================================================================
    // 🔥 분석 방법들
    // ========================================================================

    function analyzePattern(targetRound, startRound, minRate) {
        const prevWin = getWinning(targetRound - 1);
        if (!prevWin) return [];
        
        const prevNums = prevWin.main;
        const patternData = {};
        
        prevNums.forEach(prevNum => {
            patternData[prevNum] = { total: 0, carryovers: {} };
        });
        
        for (let i = 0; i < DATA.length - 1; i++) {
            const current = DATA[i];
            const next = DATA[i + 1];
            const currentNums = current.slice(1, 7);
            const nextNums = next.slice(1, 7);
            const round = current[0];
            
            if (round < startRound || round >= targetRound) continue;
            
            prevNums.forEach(prevNum => {
                if (currentNums.includes(prevNum)) {
                    patternData[prevNum].total++;
                    nextNums.forEach(nextNum => {
                        patternData[prevNum].carryovers[nextNum] = 
                            (patternData[prevNum].carryovers[nextNum] || 0) + 1;
                    });
                }
            });
        }
        
        const candidates = [];
        for (const [prevNum, data] of Object.entries(patternData)) {
            if (data.total === 0) continue;
            
            Object.entries(data.carryovers).forEach(([num, count]) => {
                const rate = Math.round((count / data.total) * 100);
                if (rate >= minRate) {
                    candidates.push({
                        from: parseInt(prevNum),
                        num: parseInt(num),
                        rate: rate,
                        count: count,
                        method: '패턴'
                    });
                }
            });
        }
        
        candidates.sort((a, b) => b.rate - a.rate);
        return candidates;
    }

            if (round < startRound || round >= targetRound) continue;
            
            next.slice(1, 7).forEach(n => {
                freq[n] = (freq[n] || 0) + 1;
            });
        }
        
        const total = Object.values(freq).reduce((a, b) => a + b, 0);
        const candidates = Object.entries(freq)
            .map(([num, count]) => ({
                num: parseInt(num),
                count: count,
                rate: Math.round((count / total) * 100),
                from: '-',
                method: '빈도'
            }))
            .filter(c => c.rate >= minRate)
            .sort((a, b) => b.rate - a.rate);
        
        return candidates;
    }

    function analyzeRecent(targetRound, startRound, minRate) {
        const recentRounds = [];
        for (let i = 1; i <= 10; i++) {
            const win = getWinning(targetRound - i);
            if (win) recentRounds.push(win.main);
        }
        
        const freq = {};
        recentRounds.forEach(round => {
            round.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
        });
        
        const total = recentRounds.length * 6;
        const candidates = Object.entries(freq)
            .map(([num, count]) => ({
                num: parseInt(num),
                count: count,
                rate: Math.round((count / total) * 100),
                from: '-',
                method: '최근'
            }))
            .filter(c => c.rate >= minRate)
            .sort((a, b) => b.rate - a.rate);
        
        return candidates;
    }

    function analyzeRare(targetRound, startRound, minRate) {
        const freq = {};
        for (let i = 0; i < DATA.length; i++) {
            const row = DATA[i];
            const round = row[0];
            if (round < startRound || round >= targetRound) continue;
            row.slice(1, 7).forEach(n => {
                freq[n] = (freq[n] || 0) + 1;
            });
        }
        
        const total = Object.values(freq).reduce((a, b) => a + b, 0);
        const candidates = Object.entries(freq)
            .map(([num, count]) => ({
                num: parseInt(num),
                count: count,
                rate: Math.round((count / total) * 100),
                from: '-',
                method: '희귀'
            }))
            .sort((a, b) => a.rate - b.rate)
            .slice(0, 20)
            .filter(c => c.rate <= minRate * 2);
        
        return candidates;
    }

    function analyzeHot(targetRound, startRound, minRate) {
        const half = Math.floor((targetRound - startRound) / 2);
        const midRound = targetRound - half;
        
        const oldFreq = {};
        const newFreq = {};
        
        for (let i = 0; i < DATA.length; i++) {
            const row = DATA[i];
            const round = row[0];
            if (round < startRound || round >= targetRound) continue;
            
            const nums = row.slice(1, 7);
            if (round < midRound) {
                nums.forEach(n => oldFreq[n] = (oldFreq[n] || 0) + 1);
            } else {
                nums.forEach(n => newFreq[n] = (newFreq[n] || 0) + 1);
            }
        }
        
        const candidates = [];
        for (let i = 1; i <= 45; i++) {
            const old = oldFreq[i] || 0;
            const now = newFreq[i] || 0;
            if (old > 0 && now > old) {
                const rate = Math.round(((now - old) / old) * 100);
                if (rate >= minRate) {
                    candidates.push({
                        num: i,
                        count: now,
                        rate: rate,
                        from: `${old}→${now}`,
                        method: '핫'
                    });
                }
            }
        }
        
        candidates.sort((a, b) => b.rate - a.rate);
        return candidates;
    }

    // ========================================================================
    // 🚀 메인 분석 함수
    // ========================================================================
    function runCarryoverAnalysis() {
        const targetRound = parseInt(document.getElementById('targetRound').value) || 1235;
        const startRound = parseInt(document.getElementById('startRound').value) || 1000;
        const minRate = parseInt(document.getElementById('minRate').value) || 10;
        const method = document.getElementById('methodSelect').value;
        const selectCount = parseInt(document.getElementById('selectCount').value) || 3;
        const historyRange = parseInt(document.getElementById('historyRange').value) || 10;
        
        const resultDiv = document.getElementById('resultArea');
        resultDiv.innerHTML = '<div class="loading">⏳ 분석 중...</div>';
        
        let allCandidates = [];
        
        if (method === 'all' || method === 'pattern') {
            allCandidates = allCandidates.concat(analyzePattern(targetRound, startRound, minRate));
        }
        if (method === 'all' || method === 'freq') {
            allCandidates = allCandidates.concat(analyzeFrequency(targetRound, startRound, minRate));
        }
        if (method === 'all' || method === 'recent') {
            allCandidates = allCandidates.concat(analyzeRecent(targetRound, startRound, minRate));
        }
        if (method === 'all' || method === 'rare') {
            allCandidates = allCandidates.concat(analyzeRare(targetRound, startRound, minRate));
        }
        if (method === 'all' || method === 'hot') {
            allCandidates = allCandidates.concat(analyzeHot(targetRound, startRound, minRate));
        }
        
        const uniqueMap = {};
        allCandidates.forEach(c => {
            if (!uniqueMap[c.num] || c.rate > uniqueMap[c.num].rate) {
                uniqueMap[c.num] = c;
            }
        });
        
        let uniqueCandidates = Object.values(uniqueMap);
        uniqueCandidates.sort((a, b) => b.rate - a.rate);
        
        const topCandidates = uniqueCandidates.slice(0, Math.min(selectCount, uniqueCandidates.length));
        
        // 각 번호의 당첨경과 조회
        const candidatesWithHistory = topCandidates.map(c => {
            const history = getNumberHistory(c.num, targetRound, historyRange);
            return { ...c, history };
        });
        
        currentResult = {
            targetRound,
            startRound,
            minRate,
            method,
            selectCount,
            historyRange,
            topCandidates: candidatesWithHistory,
            allCandidates: uniqueCandidates
        };
        
        displayResults(currentResult);
    }

                            <th style="padding:6px; text-align:center; border:1px solid #555;">이월률</th>

    // ========================================================================
    // 🛠️ 유틸리티 함수
    // ========================================================================
    function toggleSelect(el) {
        el.classList.toggle('selected');
        updateSelectedDisplay();
    }

    function updateSelectedDisplay() {
        const selected = document.querySelectorAll('.carryover-number.selected');
        const nums = Array.from(selected).map(el => el.dataset.num);
        const display = document.getElementById('selectedDisplay');
        if (display) {
            display.textContent = nums.length > 0 ? nums.join(', ') : '없음';
        }
        
        const exportText = document.getElementById('exportText');
        if (exportText) {
            exportText.value = nums.join(', ');
        }
    }

    function copySelected() {
        const selected = document.querySelectorAll('.carryover-number.selected');
        const nums = Array.from(selected).map(el => el.dataset.num);
        if (nums.length === 0) { alert('선택된 번호가 없습니다.'); return; }
        
        navigator.clipboard.writeText(nums.join(', ')).then(() => {
            alert(`📋 복사 완료: ${nums.join(', ')}`);
        });
    }

    function copyExport() {
        const text = document.getElementById('exportText');
        text.select();
        document.execCommand('copy');
        alert('📋 복사 완료!');
    }

    function exportAsJS() {
        const selected = document.querySelectorAll('.carryover-number.selected');
        const nums = Array.from(selected).map(el => parseInt(el.dataset.num));
        if (nums.length === 0) { alert('선택된 번호가 없습니다.'); return; }
        
        const js = `const carryovers = [${nums.join(', ')}];`;
        document.getElementById('exportText').value = js;
        alert('📦 JS 배열로 변환 완료!');
    }

    function exportResult() {
        const selected = document.querySelectorAll('.carryover-number.selected');
        const nums = Array.from(selected).map(el => parseInt(el.dataset.num));
        if (nums.length === 0) { alert('선택된 번호가 없습니다.'); return; }
        
        const text = `// 이월수 후보\nconst carryovers = [${nums.join(', ')}];\n\n// 사용 예시\n// addCarryoverToCombo(combo, carryovers);`;
        document.getElementById('exportText').value = text;
    }

        currentResult = null;
    }
